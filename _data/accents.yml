# Per-post accent palettes.
#
# Set `accent: <key>` in a post's front matter to give that post its own
# colour identity. The key is looked up here and injected as CSS variables
# scoped to the post article (see _includes/metadata-hook.html), overriding
# the brand blue->green default used by the post hero band, section rails,
# `<hr>` dividers, TL;DR card numbers, links and inline code.
#
# Fields per palette:
#   grad   - the headline gradient (hero band, rails, hr, TL;DR numbers)
#   accent - solid accent (links, inline code, blockquote rail)
#   tint   - faint fill behind plain blockquotes
#   glow   - the lower-left radial highlight on the hero band
#   shadow - the hero band drop shadow
#
# Cream/ivory page backdrop and self-hosted fonts are unchanged — only the
# accent family shifts, so every post still reads as part of the same site.

ember: # warm amber/orange — caches, throughput, "heat"
  grad: "linear-gradient(135deg, #b8400a 0%, #e0680c 50%, #f2a516 100%)"
  accent: "#c2510c"
  tint: "rgba(194, 81, 12, 0.06)"
  glow: "rgba(245, 165, 22, 0.22)"
  shadow: "rgba(184, 64, 10, 0.26)"

crimson: # deep red — cache invalidation, things that break
  grad: "linear-gradient(135deg, #8a1538 0%, #c01f4a 52%, #e8576b 100%)"
  accent: "#b01e44"
  tint: "rgba(176, 30, 68, 0.055)"
  glow: "rgba(232, 87, 107, 0.22)"
  shadow: "rgba(138, 21, 56, 0.26)"

