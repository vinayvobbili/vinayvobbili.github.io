<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Source for find-evil-hero.png. Render: rsvg-convert -w 1280 find-evil-hero.svg -o find-evil-hero.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1326"/>
      <stop offset="1" stop-color="#12213f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a6"/>
      <stop offset="1" stop-color="#23a3ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="9" fill="url(#accent)"/>
  <rect x="0" y="711" width="1280" height="9" fill="url(#accent)"/>

  <text x="64" y="86" fill="#7f97c2" font-size="30" font-weight="700" letter-spacing="7">SANS · FIND EVIL! HACKATHON</text>

  <text x="60" y="240" fill="#f5f8ff" font-size="176" font-weight="800" letter-spacing="-3">find-evil</text>
  <g stroke="#2ee6a6" stroke-width="13" fill="none">
    <circle cx="985" cy="190" r="48"/>
    <line x1="1021" y1="226" x2="1064" y2="269" stroke-linecap="round"/>
  </g>

  <text x="64" y="322" fill="#cfe0ff" font-size="46" font-weight="700">Stops Protocol SIFT from hallucinating IOCs</text>

  <rect x="64" y="402" width="1152" height="200" rx="22" fill="#0b1426" stroke="#26365a" stroke-width="2"/>
  <text x="96" y="468" fill="#7f97c2" font-size="31" font-family="DejaVu Sans Mono, monospace">the agent corrects its own read — live:</text>
  <text x="96" y="556" font-size="62" font-family="DejaVu Sans Mono, monospace" font-weight="700">
    <tspan fill="#ff5d73">185.220.101.50</tspan><tspan fill="#5d76a6">&#160;&#160;→&#160;&#160;</tspan><tspan fill="#2ee6a6">185.220.101.5</tspan>
  </text>

  <text x="64" y="668" fill="#8aa0c6" font-size="29" font-weight="700">A live Protocol SIFT investigation · MIT</text>
